<!doctype html>
<html lang="ru" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Вход — прототип ITSM">
  <title>Вход — ITSM</title>
  <script src="js/config.js"></script>
  <script src="js/core/theme-bootstrap.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages/login.css">
</head>
<body>
  <main class="container min-vh-100 d-flex align-items-center justify-content-center py-4">
    <section class="card border-0 shadow-sm w-100" style="max-width: 28rem" aria-labelledby="login-title">
      <div class="card-body p-4 p-md-5">
        <div class="d-flex justify-content-end gap-2 mb-4">
          <select id="login-language" class="form-select form-select-sm w-auto" aria-label="Язык">
            <option value="ru">Русский</option>
            <option value="en">English</option>
          </select>
          <select id="login-theme" class="form-select form-select-sm w-auto" aria-label="Тема">
            <option value="light">Светлая</option>
            <option value="dark">Тёмная</option>
          </select>
        </div>
        <h1 id="login-title" class="h3 mb-2" data-i18n="login.title">Вход в ITSM</h1>
        <p class="text-body-secondary mb-4" data-i18n="login.subtitle">Введите учётные данные пользователя.</p>
        <div id="login-error" class="alert alert-danger d-none" role="alert"></div>
        <form id="login-form" novalidate>
          <div class="mb-3">
            <label class="form-label" for="login" data-i18n="login.login">Логин</label>
            <input class="form-control" id="login" name="login" autocomplete="username" required>
            <div class="invalid-feedback" data-i18n="login.loginRequired">Введите логин.</div>
          </div>
          <div class="mb-4">
            <label class="form-label" for="password" data-i18n="login.password">Пароль</label>
            <input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required>
            <div class="invalid-feedback" data-i18n="login.passwordRequired">Введите пароль.</div>
          </div>
          <button id="login-submit" class="btn btn-primary w-100" type="submit">
            <span class="login-submit-label" data-i18n="login.submit">Войти</span>
            <span class="login-submit-spinner spinner-border spinner-border-sm d-none" aria-hidden="true"></span>
          </button>
        </form>
      </div>
    </section>
  </main>
  <noscript><div class="alert alert-danger m-3">Для работы интерфейса требуется JavaScript.</div></noscript>
  <script type="module" src="js/pages/login-page.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
